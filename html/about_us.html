<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/styles.css">
    <title>CIGEMS - About 'use strict'</title>
</head>

<body>
    <header>
        <a href="../html/index.html" class="logo">
            <img src="../img/logo.png" alt="LOGO_Img" width="400">
        </a>
        <nav>
            <a href="./index.html">HOME</a>
            <a href="./find_gem.html">FIND YOUR GEM</a>
            <a href="./products.html">OUR PRODUCTS</a>
            <a href="./about_us.html">ABOUT US</a>
        </nav>
        <div class="cart">
            <img src="../img/cart.png" alt="Cart Icon" class="cart-icon">
            <span class="cart-count">0</span>
        </div>
        <button id="openModal" class="sign_up_button">SIGN UP</button>
        <button id="openLogin" class="login_button">LOGIN</button>
    </header>

    <section class="banner banner_2">
        <div class="banner_text">
            <h1>About us</h1>
            <p>- Learn about our story -</p>
        </div>
    </section>
    <br>
    <section class="about-us">
        <div class="team-member">
            <img src="../img/isabelle.jpeg" alt="Isabelle" class="profile-pic">
            <h3>Isabelle Somphone</h3>
            <p>Co-Founder</p>
        </div>

        <div class="team-member">
            <img src="../img/Corentin.png" alt="Corentin" class="profile-pic">
            <h3>Corentin Monsallier</h3>
            <p>Co-Founder</p>
        </div>
    </section>
    <footer>
        <p>©️2025 Isabelle Somphone & Corentin Monsallier.</p>
        <p>All rights reserved.</p>
    </footer>
    <section id="signupModal" class="form_sign_up">
        <div class="form-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form id="signupForm">
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="age">Age</label>
                <input type="number" id="age" min="0" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" required>

                <label for="repeat-password">Repeat Password</label>
                <input type="password" id="repeat-password" required>

                <button type="submit">Submit</button>
            </form>
        </div>
    </section>

    <section id="login_form" class="form_sign_up">
        <div class="form-content">
            <span class="close-login">&times;</span>
            <h2>Login</h2>
            <form id="loginForm">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </section>

    <script src="../js/cart.js"></script>
    <script src="../js/signup_login.js"></script>
</body>

</html>
