<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/styles.css">
    <title>CIGEMS - Products</title>
</head>
<body>
    <header>
        <a href="../html/index.html" class="logo">
            <img src="../img/logo.png" alt="LOGO_Img" width="400">
        </a>
        <nav>
            <a href="./index.html">HOME</a>
            <a href="./find_gem.html">FIND YOUR GEM</a>
            <a href="./products.html">OUR PRODUCTS</a>
            <a href="./about_us.html">ABOUT US</a>
        </nav>
        <button id="openModal" class="sign_up_button">SIGN UP</button>
    </header>
    
    <section class="banner banner_4">
        <div class="banner_text">
            <h1>Our products</h1>
            <p>- your heaven to find a perfect gem -</p>
        </div>
    </section>
<br>
    <section class="products">
        <div class="prod1">
            
            <img class="prod" src="../img/prod1.jpg" alt="product1">
            <h1>Tanzanite</h1>
            <p class="price">$100 000</p>
            <p><button>Add to Cart</button></p>
        </div>
        <div class="prod2">
            <img class="prod" src="../img/prod2.png" alt="product2">
            <h1>Ruby</h1>
            <p class="price">$150 000</p>
            <p><button>Add to Cart</button></p>
        </div>
        <div class="prod3">
            <img class="prod" src="../img/prod3.png" alt="product3">
            <h1>Emerald</h1>
            <p class="price">$110 000</p>
            <p><button>Add to Cart</button></p>
        </div>
        <div class="prod4">
            <img class="prod" src="../img/prod4.png" alt="product4">
            <h1>Tourmaline</h1>
            <p class="price">$200 000</p>
            <p><button>Add to Cart</button></p>
        </div>
        <div class="prod5">
            <img class="prod" src="../img/prod5.png" alt="product4">
            <h1>Pezzottaire</h1>
            <p class="price">$500 000</p>
            <p><button>Add to Cart</button></p>
        </div>
        <div class="prod6">
            <img class="prod" src="../img/prod6.png" alt="product4">
            <h1>Diamond</h1>
            <p class="price">$1 000 000</p>
            <p><button>Add to Cart</button></p>
        </div>
    </section>

    <footer>
        <p>©️2025 Isabelle Somphone & Corentin Monsallier.</p>
        <p>All rights reserved.</p>
    </footer>

    <section id="signupModal" class="form_sign_up">
        <div class="form-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form id="signupForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="0" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="repeat-password">Repeat Password</label>
            <input type="password" id="repeat-password" required>

            <button type="submit">Submit</button>
            </form>
        </div>
    </section>
<script src="../js/script.js"></script>

</body>
</html>
