<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/styles.css">
    <title>CIGEMS - Find your gem</title>
</head>
<body>
    <header>
        <a href="../html/index.html" class="logo">
            <img src="../img/logo.png" alt="LOGO_Img" width="400">
        </a>
        <nav>
            <a href="./index.html">HOME</a>
            <a href="./find_gem.html">FIND YOUR GEM</a>
            <a href="./products.html">OUR PRODUCTS</a>
            <a href="./about_us.html">ABOUT US</a>
        </nav>
        <button id="openModal" class="sign_up_button">SIGN UP</button>

    </header>
    
    <section class="banner banner_3">
        <div class="banner_text">
            <h1>Find your gems </h1>
            <p>- Let your birthday determines your fate -</p>
        </div>
    </section>
    <section class="find_gem">
        <div class="wheel_selector">
            <div class="spin_btn"></div>
            <div class="wheel">
                <div class="gem gem_1"><span>1</span></div>
                <div class="gem gem_2"><span>2</span></div>
                <div class="gem gem_3"><span>3</span></div>
                <div class="gem gem_4"><span>4</span></div>
                <div class="gem gem_5"><span>5</span></div>
                <div class="gem gem_6"><span>6</span></div>
                <div class="gem gem_7"><span>7</span></div>
                <div class="gem gem_8"><span>8</span></div>
                <div class="gem gem_9"><span>9</span></div>
                <div class="gem gem_10"><span>10</span></div>
                <div class="gem gem_11"><span>11</span></div>
                <div class="gem gem_12"><span>12</span></div>
                <div class="gem gem_13"><span>13</span></div>
            </div>
        </div>
        <div class="sign_selector">
        </div>
    </section>
    <br>
    <footer>
        <p>©️2025 Isabelle Somphone & Corentin Monsallier.</p>
        <p>All rights reserved.</p>
    </footer>
    <section id="signupModal" class="form_sign_up">
        <div class="form-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form id="signupForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="0" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="repeat-password">Repeat Password</label>
            <input type="password" id="repeat-password" required>

            <button type="submit">Submit</button>
            </form>
        </div>
    </section>
<script src="../js/script.js"></script>

</body>
</html>
