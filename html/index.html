<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/styles.css">
    <title>CIGEMS - Home</title>
</head>
<body>
    <section id="signupModal" class="form_sign_up">
        <div class="form-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form id="signupForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="0" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="repeat-password">Repeat Password</label>
            <input type="password" id="repeat-password" required>

            <button type="submit">Submit</button>
            </form>
        </div>
    </section>
    <header>
        <a href="../html/index.html" class="logo">
            <img src="../img/logo.png" alt="LOGO_Img" width="400">
        </a>
        <nav>
            <a href="./index.html">HOME</a>
            <!--<a href="./find_gem.html">FIND YOUR GEM</a>-->
            <a href="./products.html">OUR PRODUCTS</a>
            <a href="./about_us.html">ABOUT US</a>
        </nav>
        <div class="cart">
            <img src="../img/cart.png" alt="Cart Icon" class="cart-icon">
        <span class="cart-count">0</span>
        </div>
        <button id="openModal" class="sign_up_button">SIGN UP</button>
    </header>
    
    <section class="banner banner_1">
        <div class="banner_text">
            <h1>Welcome to CIGEMS</h1>
            <p>- your heaven to find a perfect gem -</p>
        </div>
    </section>

    <section class="slideshow">
        <img class="mySlides" src="../img/best_seller1.jpg">
        <img class="mySlides" src="../img/best_seller2.jpg">
        <img class="mySlides" src="../img/best_seller3.jpg">
        <img class="mySlides" src="../img/best_seller4.jpg">
        <img class="mySlides" src="../img/best_seller5.jpg">

        <button class="display-left" onclick="plusSlides(-1)">&#10094;</button>
        <button class="display-right" onclick="plusSlides(1)">&#10095;</button>
    </section>

    <footer>
        <p>©️2025 Isabelle Somphone & Corentin Monsallier.</p>
        <p>All rights reserved.</p>
    </footer>



    <script src="../js/script.js"></script>

<script src="../js/carrousel.js"></script>
</body>

</html>
